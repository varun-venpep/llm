<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg)" rx="8"/>
  <rect x="8" y="8" width="384" height="264" fill="none" stroke="url(#border)" stroke-width="1.5" rx="6" stroke-dasharray="6 4"/>
  <rect x="20" y="20" width="360" height="240" fill="none" stroke="#ffffff08" stroke-width="1" rx="4"/>
  <!-- Decorative corner elements -->
  <polygon points="20,20 44,20 20,44" fill="#6366f120"/>
  <polygon points="380,20 356,20 380,44" fill="#6366f120"/>
  <polygon points="20,260 44,260 20,236" fill="#6366f120"/>
  <polygon points="380,260 356,260 380,236" fill="#6366f120"/>
  <!-- Award icon -->
  <circle cx="200" cy="100" r="28" fill="#6366f115" stroke="#6366f140" stroke-width="1.5"/>
  <text x="200" y="110" font-family="serif" font-size="28" fill="#6366f180" text-anchor="middle">🏆</text>
  <!-- Title lines -->
  <rect x="130" y="145" width="140" height="8" rx="4" fill="#ffffff15"/>
  <rect x="150" y="162" width="100" height="6" rx="3" fill="#ffffff10"/>
  <rect x="160" y="178" width="80" height="5" rx="2.5" fill="#ffffff08"/>
  <!-- Bottom decorative line -->
  <rect x="100" y="220" width="200" height="1" fill="#6366f130"/>
  <rect x="140" y="228" width="120" height="1" fill="#6366f120"/>
</svg>
