name: Multi-Account Deploy

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Diagnostic: Check if secrets are actually present
      - name: Check Secret Presence
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID_DEV }}" ]; then echo "❌ AWS_ACCESS_KEY_ID_DEV is MISSING"; else echo "✅ AWS_ACCESS_KEY_ID_DEV is present"; fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}" ]; then echo "❌ AWS_SECRET_ACCESS_KEY_DEV is MISSING"; else echo "✅ AWS_SECRET_ACCESS_KEY_DEV is present"; fi

      # 1. Deployment to NEW ACCOUNT (development)
      - name: Configure AWS Credentials (Dev)
        if: github.ref == 'refs/heads/development'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ap-southeast-1

      - name: Unlock Dev
        if: github.ref == 'refs/heads/development'
        run: npx sst unlock --stage dev

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/development'
        run: npx sst deploy --stage dev

      # 2. Deployment to OTHER ACCOUNT (production)
      - name: Configure AWS Credentials (Prod)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ap-southeast-1 # Adjust if prod is in a different region

      - name: Unlock Production
        if: github.ref == 'refs/heads/main'
        run: npx sst unlock --stage prod

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: npx sst deploy --stage prod
