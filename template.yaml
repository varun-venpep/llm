AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LLM Staging/Dev Infrastructure - Next.js (Lambda) & Whisper (ECS)

Parameters:
  Stage:
    Type: String
    Default: dev
  DatabaseUrl:
    Type: String
    NoEcho: true
  AppDomain:
    Type: String
    Default: lebra.ai

Resources:
  # 1. Networking
  LmsVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub llm-${Stage}-vpc

  LmsInternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref LmsVpc
      InternetGatewayId: !Ref LmsInternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LmsVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [ 0, !GetAZs "" ]
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LmsVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [ 1, !GetAZs "" ]
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LmsVpc

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref LmsInternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # 2. Security Groups
  LmsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic
      VpcId: !Ref LmsVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 10000
          ToPort: 10000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  # 3. Storage
  LmsStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub llm-${Stage}-storage-bucket-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: ["GET", "HEAD", "PUT"]
            AllowedOrigins: ["*"]
            MaxAge: 3600

  LmsStorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LmsStorageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${LmsStorageBucket}/*"

  # 4. Compute - Next.js App (Lambda)
  LmsWebFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest
      BuildArgs:
        NEXT_PUBLIC_ROOT_DOMAIN: !Sub ${Stage}.${AppDomain}
        NEXT_PUBLIC_APP_URL: !Sub https://${Stage}.${AppDomain}
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 30
      Policies:
        # Give the function permissions to the S3 bucket
        - S3CrudPolicy:
            BucketName: !Sub llm-${Stage}-storage-bucket-${AWS::AccountId}
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          NEXT_PUBLIC_S3_BUCKET: !Ref LmsStorageBucket
          NEXT_PUBLIC_ROOT_DOMAIN: !Sub ${Stage}.${AppDomain}
          ROOT_DOMAIN: !Sub ${Stage}.${AppDomain}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  # 5. Compute - Whisper Service (ECS)
  WhisperRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub llm-${Stage}-whisper-repo

  LmsEcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub llm-${Stage}-cluster

  WhisperTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub llm-${Stage}-whisper
      Cpu: 1024
      Memory: 4096
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt WhisperExecutionRole.Arn
      ContainerDefinitions:
        - Name: whisper
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${WhisperRepository}:latest
          Environment:
            - Name: DATABASE_URL
              Value: !Ref DatabaseUrl
            - Name: WHISPER_MODEL_SIZE
              Value: base
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WhisperLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: whisper
          PortMappings:
            - ContainerPort: 10000

  WhisperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/llm-${Stage}-whisper
      RetentionInDays: 7

  WhisperExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  WhisperLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub llm-${Stage}-whisper-alb
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref LmsSecurityGroup
      Scheme: internet-facing
      Type: application

  WhisperTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub llm-${Stage}-whisper-tg
      VpcId: !Ref LmsVpc
      Port: 10000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  WhisperListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref WhisperLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref LmsWildcardCertificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WhisperTargetGroup

  WhisperService:
    Type: AWS::ECS::Service
    DependsOn: WhisperListener
    Properties:
      Cluster: !Ref LmsEcsCluster
      ServiceName: !Sub llm-${Stage}-whisper-service
      TaskDefinition: !Ref WhisperTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref LmsSecurityGroup
      LoadBalancers:
        - ContainerName: whisper
          ContainerPort: 10000
          TargetGroupArn: !Ref WhisperTargetGroup

  # 6. DNS & SSL
  LmsHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref AppDomain

  LmsWildcardCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "*.${Stage}.${AppDomain}"
      SubjectAlternativeNames:
        - !Sub "${Stage}.${AppDomain}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "*.${Stage}.${AppDomain}"
          HostedZoneId: !Ref LmsHostedZone

  LmsApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Sub "*.${Stage}.${AppDomain}"
      DomainNameConfigurations:
        - CertificateArn: !Ref LmsWildcardCertificate
          EndpointType: REGIONAL

  LmsRootApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Sub "${Stage}.${AppDomain}"
      DomainNameConfigurations:
        - CertificateArn: !Ref LmsWildcardCertificate
          EndpointType: REGIONAL

  LmsApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref ServerlessHttpApi
      DomainName: !Ref LmsApiCustomDomain
      Stage: !Ref ServerlessHttpApiApiGatewayDefaultStage

  LmsRootApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref ServerlessHttpApi
      DomainName: !Ref LmsRootApiCustomDomain
      Stage: !Ref ServerlessHttpApiApiGatewayDefaultStage

  LmsWildcardDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref LmsHostedZone
      Name: !Sub "*.${Stage}.${AppDomain}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt LmsApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt LmsApiCustomDomain.RegionalHostedZoneId

  LmsRootDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref LmsHostedZone
      Name: !Sub "${Stage}.${AppDomain}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt LmsRootApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt LmsRootApiCustomDomain.RegionalHostedZoneId

  WhisperDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref LmsHostedZone
      Name: !Sub "whisper.${Stage}.${AppDomain}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt WhisperLoadBalancer.DNSName
        HostedZoneId: !GetAtt WhisperLoadBalancer.CanonicalHostedZoneID

Outputs:
  WebsiteUrl:
    Description: URL of the Next.js application
    Value: !Sub https://${Stage}.${AppDomain}
  NameServers:
    Description: Name Servers for GoDaddy configuration
    Value: !Join [", ", !GetAtt LmsHostedZone.NameServers]
  WhisperAlbUrl:
    Description: The internal Load Balancer URL to configure in the LMS UI for Whisper transcription runs
    Value: !Sub https://whisper.${Stage}.${AppDomain}
